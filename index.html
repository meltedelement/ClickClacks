<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weapon Balls</title>
  </head>
  <body>
    <main class="stage">
      <canvas id="arena"></canvas>
    </main>

    <div class="menu">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-panel">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <div id="menu-panel" class="menu-panel" hidden>
        <section class="menu-section">
          <h2>Matchup</h2>
          <div id="fighter-selects" class="fighter-selects"></div>
        </section>

        <section class="menu-section">
          <h2>Simulation</h2>
          <div class="buttons">
            <button id="restart" type="button">Restart</button>
            <button id="pause" type="button">Pause</button>
          </div>
          <label class="field">
            <span class="field-label">Speed</span>
            <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" />
            <output id="speed-value">1×</output>
          </label>
          <label class="check"><input id="hitboxes" type="checkbox" /> Show hitboxes</label>
          <label class="check"><input id="auto-rematch" type="checkbox" /> Auto rematch</label>
          <button id="fullscreen" type="button">Enter fullscreen</button>
        </section>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
